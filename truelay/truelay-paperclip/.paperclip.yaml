schema: paperclip/v1
schemaVersion: 7
company:
  requireBoardApprovalForNewAgents: true
  logoPath: images/company-logo.png
agents:
  ceo:
    role: ceo
    budgetMonthlyCents: 4000
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5-5
        effort: medium
        maxTurnsPerRun: 60
        timeoutSec: 1800
        graceSec: 15
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        wakeOnAssignment: true
        wakeOnAutomation: true
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: false
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: optional
          description: Anthropic API key. Leave empty to use the key or Claude login on the Paperclip host.
        ERP_API_URL:
          kind: plain
          requirement: optional
          description: ERP base URL (Zoho Inventory, Odoo or ERPNext). Leave empty until connected; agents then read data/erp/ files.
        ERP_API_TOKEN:
          kind: secret
          requirement: optional
          description: ERP read token. Read-only first; write tools stay ask-first.
        ACCOUNTING_API_URL:
          kind: plain
          requirement: optional
          description: Accounting base URL (Zoho Books or Tally Prime gateway).
        ACCOUNTING_API_TOKEN:
          kind: secret
          requirement: optional
          description: Accounting read token.
        CRM_API_URL:
          kind: plain
          requirement: optional
          description: CRM base URL (Zoho CRM, HubSpot or Odoo CRM).
        CRM_API_TOKEN:
          kind: secret
          requirement: optional
          description: CRM token. Bulk export and bulk send stay ask-first.
