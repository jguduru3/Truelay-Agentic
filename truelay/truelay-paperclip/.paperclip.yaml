    color: "#dc2626"
  finance-governance:
    leadAgentSlug: cfo
    color: "#475569"
  setup:
    leadAgentSlug: ceo
    color: "#65a30d"
tasks:
  resolve-source-gaps:
    priority: high
  build-sku-master:
    priority: high
  compliance-register:
    priority: high
  founder-dashboard:
    priority: high
  crm-migration:
    priority: medium
  cold-chain-loggers:
    priority: medium
  hire-india-b2b-kam:
    priority: medium
  mygate-pilot:
    priority: medium
  gem-registration:
    priority: medium
routines:
  daily-buy-plan-run:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Daily buy plan
        cronExpression: "30 3 * * *"
        timezone: Asia/Kolkata
  cold-chain-sweep:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        label: Cold-chain sweep
        cronExpression: "0 */2 * * *"
        timezone: Asia/Kolkata
